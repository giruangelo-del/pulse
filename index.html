 d.innerHTML='<div class="wv"><i class="rg"></i><i class="rg"></i><i class="rg"></i><svg viewBox="0 0 120 60" width="170" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path class="ln" d="M5 32 H35 L45 12 L60 52 L72 22 L80 32 H115"/><circle class="dt" cx="115" cy="32" r="4.5"/></svg></div><h1>PULSE</h1><p>Plan. Focus. Recover.</p><small>Tap to continue</small>';
 d.onclick=hideSplash;document.body.appendChild(d);setTimeout(hideSplash,2600)}
intro();render();
const showSignin=()=>{const d=document.createElement('div');d.id='signin';
 d.innerHTML=`<div style="max-width:360px;width:100%"><div class="av" style="background:var(--ac);margin:0 auto 10px">P</div><h2 style="text-align:center;margin:0 0 4px">Sign in</h2><div class="mut" style="text-align:center;margin-bottom:14px">Choose a profile</div>${PR.list.map(p=>`<button class="card" style="width:100%;display:flex;align-items:center;gap:12px;cursor:pointer;font:inherit;color:var(--tx);text-align:left;margin-bottom:8px" data-a="pick" data-id="${p.id}"><div class="av sm" style="background:${p.color}">${esc((p.name[0]||'?').toUpperCase())}</div><b>${esc(p.name)}</b></button>`).join('')}<form data-f="newprof" style="margin-top:12px"><input name="name" required placeholder="New profile name"><button class="btn w">Create profile</button></form></div>`;document.body.appendChild(d)};
if(PR.out)showSignin();
</script></body></html>
