<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1120">
<title>Pulse</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f8fafc;--card:#fff;--tx:#0f172a;--mut:#64748b;--bd:#e2e8f0;--ac:#2563eb;--sb:#0b1120;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--bd:#334155;--ac:#3b82f6}}
body.burn{--bg:#faf9f6;--card:#fff;--tx:#292524;--mut:#78716c;--bd:#e7e5e4;--ac:#e11d48;--sb:#f5f5f4}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--tx);transition:background .4s}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;background:var(--sb);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:9;gap:2px}
nav button{flex:1 0 64px;background:none;border:0;color:#94a3b8;font-size:11px;padding:6px 2px;border-radius:10px;cursor:pointer}
nav button b{display:block;font-size:20px;font-weight:400}nav button.on{background:var(--ac);color:#fff}
body.burn nav button{color:#78716c}body.burn nav button.on{color:#fff}
main{padding:16px 14px 100px;max-width:900px;margin:auto}
h2{margin:4px 0 2px;font-size:26px}.sub{color:var(--mut);font-size:13px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.big{font-size:28px;font-weight:700}.mut{color:var(--mut);font-size:12px}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px}
label{font-size:12px;color:var(--mut)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.w{width:100%}.ic{background:none;border:0;font-size:18px;cursor:pointer;color:var(--mut);padding:6px}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}.row>div:first-child{flex:1;min-width:0}
.done{text-decoration:line-through;opacity:.5}.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--bd)}
.High{background:#fee2e2;color:#b91c1c}.Medium{background:#fef3c7;color:#b45309}.Low{background:#dcfce7;color:#15803d}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden;margin:4px 0 12px}.bar i{display:block;height:100%;background:var(--ac)}
.run{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.ban{background:#fff1f2;border:1px solid #fecdd3;color:#9f1239;border-radius:16px;padding:14px;margin-bottom:14px}
.empty{text-align:center;color:var(--mut);padding:30px}
.burnbtn{width:100%;margin-top:14px;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
@media(min-width:768px){
nav{top:0;bottom:auto;width:200px;flex-direction:column;overflow:visible;padding:24px 10px}
nav button{flex:none;text-align:left;display:flex;gap:10px;align-items:center;font-size:14px;padding:10px 12px}nav button b{font-size:18px;display:inline}
main{margin-left:200px;padding:32px 40px;max-width:none}}
</style></head><body>
<nav id="nav"></nav><main id="m"></main>
<script>
const K='pulse-v1',$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={tab:'dashboard',burn:false,acts:[],orgs:[],jours:[],timer:null,jt:''};
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const TABS=[['dashboard','🏠','Home'],['inbox','📥','Inbox'],['planner','📅','Planner'],['delegation','👥','Delegate'],['organizations','💼','Orgs'],['analytics','📊','Stats'],['journal','📓','Journal']];
let msgI=0;
const msg=()=>{const n=S.acts.filter(a=>a.status==='Completed'&&!a.triage).length,w=n+' task'+(n===1?'':'s');
return [`You've completed ${w}. That is real effort, so give yourself permission to rest.`,`Only your High-priority tasks are showing. ${w} done already, and everything else can wait.`,`It's okay to slow down today. You've done ${w}. Take a breath and come back when you're ready.`][msgI%3]};
const mins=a=>a.actual||a.dur||30;
const orgName=i=>(S.orgs.find(o=>o.id===i)||{}).name||'Unassigned';
const done=a=>a.status==='Completed'&&!a.triage;
const visible=()=>S.acts.filter(a=>!a.triage&&!a.deleg).filter(a=>!(S.burn&&a.status!=='Completed')||a.pri==='High');
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const orgOpts=(sel,ph)=>`<option value="">${ph}</option>`+S.orgs.map(o=>`<option value="${o.id}" ${o.id===sel?'selected':''}>${esc(o.name)}</option>`).join('');

function taskRow(t,full){
 const run=S.timer&&S.timer.id===t.id;
 return `<div class="card row ${run?'run':''}"><div>
 <div class="${t.status==='Completed'?'done':''}"><b>${esc(t.title)}</b> <span class="tag ${t.pri}">${t.pri}</span></div>
 ${full?`<div class="mut">Est ${t.dur}m${t.actual?` · Logged ${t.actual}m`:''} · ${esc(t.type)} · ${esc(orgName(t.org))}</div>`:''}</div>
 <button class="ic" data-a="toggle" data-id="${t.id}">${t.status==='Completed'?'✅':'⚪'}</button>
 ${full&&t.status!=='Completed'?`<button class="ic" data-a="timer" data-id="${t.id}">${run?`⏹ <span id="tm">${fmt(Math.floor((Date.now()-S.timer.start)/1000))}</span>`:'▶'}</button>`:''}
 ${full?`<button class="ic" data-a="del" data-id="${t.id}">🗑</button>`:''}</div>`;
}
const empty=t=>`<div class="card empty">${t}</div>`;

const sum=t=>{const p=t.split(/[.!?\n]+/).map(x=>x.trim()).filter(Boolean);
 return{w:p.filter(x=>/\b(finish|complet|done|shipped|launch|solved|won|closed|sent|achiev)/i.test(x)),a:p.filter(x=>/\b(need to|have to|must|tomorrow|to-?do|follow up|remind|next)\b/i.test(x))}};
const list=(h,c,a)=>a.length?`<div style="margin-top:8px"><b style="color:${c};font-size:13px">${h}</b><ul style="margin:4px 0;padding-left:20px">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:'';
const V={
dashboard(){
 const d=S.acts.filter(done),h=(d.reduce((a,t)=>a+mins(t),0)/60).toFixed(1),w=S.acts.filter(a=>a.deleg&&a.status!=='Completed').length;
 const f=visible().filter(a=>a.status!=='Completed').slice(0,5);
 return `<div class="grid"><div class="card"><div class="big">${d.length}</div><b>Completed</b><div class="mut">All tasks</div></div>
 <div class="card"><div class="big">${h}h</div><b>Time logged</b><div class="mut">Productive hours</div></div>
 <div class="card"><div class="big">${w}</div><b>Waiting on</b><div class="mut">Pending delegations</div></div></div>
 <h3>Today's focus</h3>${f.length?f.map(t=>taskRow(t,false)).join(''):empty('Nothing pending. Add a task in the Planner.')}
 <div class="card"><b>Move data between devices</b><div class="mut" style="margin:4px 0 10px">Export a backup file, send it to your other device, and import it there. Import adds anything that device is missing.</div>
 <div class="grid" style="gap:8px"><button class="btn" data-a="export">⬇ Export backup</button><label class="btn" style="text-align:center;margin:0;color:#fff;font-size:15px">⬆ Import backup<input type="file" accept=".json,application/json" data-c="import" hidden></label></div></div>`;
},
inbox(){
 const l=S.acts.filter(a=>a.triage);
 return `<form data-f="triage" class="card"><input name="t" placeholder="Quick capture: what's on your mind?" required><button class="btn w">Drop in inbox</button></form>
 ${l.length?l.map(t=>`<div class="card"><b>${esc(t.title)}</b><div class="row" style="margin-top:8px"><select data-c="assign" data-id="${t.id}" style="margin:0">${orgOpts('','Assign org…')}</select>
 <button class="btn" data-a="plan" data-id="${t.id}">To planner</button><button class="ic" data-a="del" data-id="${t.id}">🗑</button></div></div>`).join(''):empty('Inbox zero. Nice work!')}`;
},
planner(){
 const l=visible();
 return `<form data-f="task" class="card"><b>Plan activity</b><br><label>Title</label><input name="title" required placeholder="What needs doing?">
 <div class="grid" style="gap:10px"><div><label>Estimate (min)</label><input name="dur" type="number" min="5" step="5" value="30"></div>
 <div><label>Priority</label><select name="pri"><option>High</option><option selected>Medium</option><option>Low</option></select></div></div>
 <label>Type</label><select name="type"><option>Deep Work</option><option>Strategic</option><option>Admin/Operations</option><option>Meeting</option></select>
 <label>Organization</label><select name="org">${orgOpts('','Personal / none')}</select><button class="btn w">Add task</button></form>
 ${l.length?l.map(t=>taskRow(t,true)).join(''):empty('No tasks yet.')}`;
},
delegation(){
 const l=S.acts.filter(a=>a.deleg);
 return `<form data-f="deleg" class="card"><b>Delegate task</b><br><label>Title</label><input name="title" required>
 <label>Delegated to</label><input name="to" required placeholder="Name or role"><label>Follow-up date</label><input name="fu" type="date" required>
 <label>Organization</label><select name="org">${orgOpts('','Personal / none')}</select><button class="btn w">Assign</button></form>
 ${l.length?l.map(t=>`<div class="card row"><div><b>${esc(t.title)}</b><div class="mut">👤 ${esc(t.deleg)} · Follow up ${esc(t.fu)} · ${esc(orgName(t.org))}</div></div>
 <select data-c="dstatus" data-id="${t.id}" style="width:auto;margin:0"><option value="Waiting" ${t.status==='Waiting'?'selected':''}>Waiting</option><option value="Completed" ${t.status==='Completed'?'selected':''}>Resolved</option></select>
 <button class="ic" data-a="del" data-id="${t.id}">🗑</button></div>`).join(''):empty('Nothing delegated.')}`;
},
organizations(){
 return `<form data-f="org" class="card"><b>Add affiliation</b><br><label>Organization name</label><input name="name" required><label>Your role</label><input name="role" required><button class="btn w">Create profile</button></form>
 ${S.orgs.length?S.orgs.map(o=>{const t=S.acts.filter(a=>a.org===o.id&&!a.triage),c=t.filter(a=>a.status==='Completed').length,p=t.length?c/t.length*100:0;
 return `<div class="card"><div class="row"><div><b>${esc(o.name)}</b> <span class="tag">${esc(o.role)}</span></div><button class="ic" data-a="delorg" data-id="${o.id}">🗑</button></div>
 <div class="mut" style="margin-top:8px">Completion ${c}/${t.length}</div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join(''):empty('No organizations yet.')}`;
},
analytics(){
 const ty={},og={},day={},nw=new Date();nw.setHours(0,0,0,0);
 S.acts.filter(a=>done(a)&&!a.deleg).forEach(a=>{const m=mins(a),n=orgName(a.org);ty[a.type||'Other']=(ty[a.type||'Other']||0)+m;og[n]=(og[n]||0)+m;
  const d=new Date(a.doneAt||a.created||Date.now());d.setHours(0,0,0,0);const k=Math.round((nw-d)/864e5);if(k>=0&&k<7)day[k]=(day[k]||0)+m});
 const COL=['#3b82f6','#10b981','#f59e0b','#8b5cf6','#ef4444','#64748b'];
 const sorted=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]);
 const donut=e=>{const tot=e.reduce((a,x)=>a+x[1],0);if(!tot)return '<div class="mut">No completed tasks yet.</div>';const C=2*Math.PI*40;let off=0;
  const seg=e.map(([k,v],i)=>{const l=v/tot*C,c=`<circle r="40" cx="60" cy="60" fill="none" stroke="${COL[i%6]}" stroke-width="20" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=l;return c}).join('');
  return `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 120 120" width="130" height="130">${seg}<text x="60" y="65" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">${(tot/60).toFixed(1)}h</text></svg><div>${e.map(([k,v],i)=>`<div style="font-size:13px;margin:3px 0"><span style="color:${COL[i%6]}">●</span> ${esc(k)} <b>${v}m</b></div>`).join('')}</div></div>`};
 const wk=[6,5,4,3,2,1,0].map(k=>day[k]||0),mx=Math.max(...wk,1);
 const week=`<svg viewBox="0 0 214 110" width="100%">${wk.map((v,i)=>{const h=v/mx*70,x=i*30+4,l=new Date(Date.now()-(6-i)*864e5).toLocaleDateString('en-US',{weekday:'short'});
  return `<rect x="${x}" y="${88-h}" width="22" height="${Math.max(h,2)}" rx="4" fill="var(--ac)"/><text x="${x+11}" y="${84-h}" text-anchor="middle" font-size="9" fill="currentColor">${v||''}</text><text x="${x+11}" y="103" text-anchor="middle" font-size="9" fill="currentColor" opacity=".6">${l}</text>`}).join('')}</svg>`;
 const e=sorted(og),mo=Math.max(...e.map(x=>x[1]),1);
 const orgBars=e.length?e.map(([k,v])=>`<div class="row"><b>${esc(k)}</b><span class="mut">${(v/60).toFixed(1)}h</span></div><div class="bar"><i style="width:${v/mo*100}%"></i></div>`).join(''):'<div class="mut">No completed tasks yet.</div>';
 return `<div class="card"><b>Where your time goes</b><br><br>${donut(sorted(ty))}</div><div class="card"><b>Minutes completed, last 7 days</b>${week}</div><div class="card"><b>Time by organization</b><br><br>${orgBars}</div>`;
},
journal(){
 return `<div class="card"><div class="row"><b>End-of-day brain dump</b><button class="ic" data-a="mic" id="mic">🎙</button></div>
 <textarea id="jt" rows="7" placeholder="What did you accomplish? Any blockers? What's next?">${esc(S.jt)}</textarea><button class="btn w" data-a="savej">Save entry</button></div>
 ${S.jours.length?S.jours.slice(0,10).map(j=>`<div class="card"><div class="row"><span class="mut">${new Date(j.at).toLocaleString()}</span><button class="ic" data-a="delj" data-id="${j.id}">🗑</button></div><p style="white-space:pre-wrap">${esc(j.text)}</p>${(x=>list('Wins','#059669',x.w)+list('Next steps','#2563eb',x.a)+((x.w.length||x.a.length)?'<div class="mut">Sorted by keywords on your device, not AI.</div>':''))(sum(j.text))}</div>`).join(''):empty('No entries yet.')}`;
}};

function render(){
 document.body.classList.toggle('burn',S.burn);
 $('#nav').innerHTML=TABS.map(([k,i,l])=>`<button class="${S.tab===k?'on':''}" data-a="tab" data-id="${k}"><b>${i}</b>${l}</button>`).join('');
 const t=TABS.find(x=>x[0]===S.tab);
 $('#m').innerHTML=`<h2>${t[2]==='Home'?'Dashboard':t[2]}</h2><div class="sub">${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</div>
 ${S.burn?`<div class="ban"><b>☕ Recovery mode</b><p style="margin:6px 0 0">${msg()}</p></div>`:''}
 ${V[S.tab]()}<button class="burnbtn" data-a="burn">${S.burn?'💗 Burnout Buffer is ON. Tap to turn off':'🌙 Activate Burnout Buffer'}</button>`;
}
function stopTimer(){
 if(!S.timer)return;const t=S.acts.find(a=>a.id===S.timer.id);
 if(t)t.actual=(t.actual||0)+Math.max(1,Math.ceil((Date.now()-S.timer.start)/60000));
 S.timer=null;
}
const A={
 export:()=>{const b=new Blob([JSON.stringify({acts:S.acts,orgs:S.orgs,jours:S.jours})],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='pulse-backup-'+new Date().toISOString().slice(0,10)+'.json';l.click();return 'skip'},
 tab:i=>S.tab=i,
 burn:()=>{S.burn=!S.burn;msgI++},
 toggle:i=>{const t=S.acts.find(a=>a.id===i);t.status=t.status==='Completed'?'Pending':'Completed';t.doneAt=t.status==='Completed'?Date.now():null;if(S.timer&&S.timer.id===i&&t.status==='Completed')stopTimer()},
 del:i=>{if(S.timer&&S.timer.id===i)S.timer=null;S.acts=S.acts.filter(a=>a.id!==i)},
 plan:i=>{S.acts.find(a=>a.id===i).triage=false},
 timer:i=>{const same=S.timer&&S.timer.id===i;stopTimer();if(!same)S.timer={id:i,start:Date.now()}},
 delorg:i=>{S.orgs=S.orgs.filter(o=>o.id!==i);S.acts.forEach(a=>{if(a.org===i)a.org=''})},
 savej:()=>{const v=($('#jt')||{}).value||S.jt;if(!v.trim())return;S.jours.unshift({id:id(),text:v.trim(),at:Date.now()});S.jt=''},
 delj:i=>{S.jours=S.jours.filter(j=>j.id!==i)},
 mic:()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){alert('Voice input is not supported in this browser.');return}
  if(window.rec){window.rec.stop();window.rec=null;$('#mic').textContent='🎙';return}
  const r=window.rec=new R();r.continuous=true;r.interimResults=false;
  r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal){S.jt+=e.results[i][0].transcript+' ';const t=$('#jt');if(t)t.value=S.jt;save()}};
  r.onend=()=>{window.rec=null;const m=$('#mic');if(m)m.textContent='🎙'};r.start();$('#mic').textContent='🔴';return 'skip'}
};
const F={
 triage:d=>S.acts.unshift({id:id(),title:d.get('t').trim(),pri:'Medium',status:'Pending',triage:true,created:Date.now()}),
 task:d=>S.acts.unshift({id:id(),title:d.get('title').trim(),dur:+d.get('dur')||30,pri:d.get('pri'),type:d.get('type'),org:d.get('org'),status:'Pending',created:Date.now()}),
 deleg:d=>S.acts.unshift({id:id(),title:d.get('title').trim(),deleg:d.get('to').trim(),fu:d.get('fu'),org:d.get('org'),pri:'Medium',type:'Delegated',status:'Waiting',created:Date.now()}),
 org:d=>S.orgs.push({id:id(),name:d.get('name').trim(),role:d.get('role').trim()})
};
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;
 if(A[b.dataset.a](b.dataset.id)==='skip')return;save();render();
});
document.addEventListener('change',e=>{
 const c=e.target.dataset.c;if(!c)return;
 if(c==='import'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);['acts','orgs','jours'].forEach(k=>(d[k]||[]).forEach(x=>{if(!S[k].some(y=>y.id===x.id))S[k].push(x)}));S.acts.sort((a,b)=>(b.created||0)-(a.created||0));save();render();alert('Backup imported.')}catch(_){alert('That file could not be read.')}};r.readAsText(f);return}const t=S.acts.find(a=>a.id===e.target.dataset.id);
 if(c==='assign'){t.org=e.target.value;t.triage=false;t.type='Strategic'}
 if(c==='dstatus')t.status=e.target.value;
 save();render();
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.dataset.f;if(!F[f])return;F[f](new FormData(e.target));save();render()});
document.addEventListener('input',e=>{if(e.target.id==='jt'){S.jt=e.target.value;save()}});
setInterval(()=>{const t=$('#tm');if(t&&S.timer)t.textContent=fmt(Math.floor((Date.now()-S.timer.start)/1000))},1000);
render();
</script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');</script>
</body></html>
