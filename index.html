<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1120">
<title>Pulse</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f8fafc;--card:#fff;--tx:#0f172a;--mut:#64748b;--bd:#e2e8f0;--ac:#2563eb;--sb:#0b1120;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--bd:#334155;--ac:#3b82f6}}
:root[data-theme=dark]{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--bd:#334155;--ac:#3b82f6}
body.burn{--bg:#111214;--card:#1a1b1e;--tx:#d4d0cb;--mut:#8b8782;--bd:#2a2b2f;--ac:#8f8179;--sb:#0b0b0c}
*{box-sizing:border-box}
body{margin:0;font:15px system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--tx);transition:background .5s,color .5s;letter-spacing:-.005em;-webkit-tap-highlight-color:transparent}
body.burn #m{filter:saturate(.2) brightness(.92)}
body.burn main{animation:none}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;background:var(--sb);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:9;gap:2px}
nav button{flex:1 0 62px;background:none;border:0;color:#94a3b8;font-size:11px;padding:6px 2px;border-radius:10px;cursor:pointer}
nav button b{display:block;font-size:20px;font-weight:400}nav button.on{background:var(--ac);color:#fff}
main{padding:16px 14px 110px;max-width:900px;margin:auto;animation:fi .25s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{margin:4px 0 2px;font-size:26px}h3{margin:14px 0 8px}.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.hb{display:flex;gap:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 4px 14px rgba(15,23,42,.05)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.big{font-size:28px;font-weight:700}.mut{color:var(--mut);font-size:12px}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}
label{font-size:12px;color:var(--mut)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer;transition:transform .1s,filter .2s}
.btn.w{width:100%}.btn:hover{filter:brightness(1.08)}.btn:active,.ic:active,nav button:active{transform:scale(.95)}
.btn.g{background:var(--bd);color:var(--tx)}
.ic{background:none;border:0;font-size:18px;cursor:pointer;color:var(--mut);padding:6px;min-width:38px;min-height:38px}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between}.row>div:first-child{flex:1;min-width:0}
.acts{display:flex;flex-wrap:wrap;justify-content:flex-end}
.done{text-decoration:line-through;opacity:.5}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--bd);color:var(--mut)}
.High{background:#fee2e2;color:#b91c1c}.Medium{background:#fef3c7;color:#b45309}.Low{background:#dcfce7;color:#15803d}
.dover{background:#fee2e2;color:#b91c1c}.dtoday{background:#fef3c7;color:#b45309}.dsoon{background:var(--bd);color:var(--mut)}
.t-High{border-left:4px solid #ef4444}.t-Medium{border-left:4px solid #f59e0b}.t-Low{border-left:4px solid #10b981}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden;margin:4px 0 12px}.bar i{display:block;height:100%;background:var(--ac)}
.run{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.ban{background:var(--card);border:1px solid var(--ac);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.empty{text-align:center;color:var(--mut);padding:34px 16px}
.hero{background:linear-gradient(135deg,var(--ac),#7c3aed);color:#fff;border:0;display:flex;align-items:center;gap:16px}
body.burn .hero{background:linear-gradient(135deg,#3b3733,#2a2826)}
.hero h3{margin:0 0 4px;font-size:20px}.hero p{margin:0;opacity:.9;font-size:13px}
.seg{display:flex;gap:6px;margin:4px 0 10px}.seg label{flex:1;margin:0}.seg input{display:none}
.seg span,.seg button{display:block;width:100%;text-align:center;padding:10px 0;border-radius:10px;border:1px solid var(--bd);font:inherit;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer;background:var(--bg)}
.seg input:checked+span,.seg button.on{color:#fff;border-color:transparent;background:var(--ac)}
.pH input:checked+span{background:#ef4444}.pM input:checked+span{background:#f59e0b}.pL input:checked+span{background:#10b981}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 10px}.chip{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.moods{display:flex;gap:8px;margin-top:8px}.moods button{flex:1;font-size:24px;padding:8px 0;border-radius:12px;border:1px solid var(--bd);background:var(--bg);cursor:pointer}
.moods button.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.breathe{width:90px;height:90px;border-radius:50%;background:var(--ac);opacity:.5;margin:8px auto 12px;animation:br 8s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(.6)}50%{transform:scale(1.1)}}
.tbar{position:sticky;top:8px;z-index:8;background:var(--ac);color:#fff;border-radius:14px;padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.burnbtn{width:100%;margin-top:14px;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
details{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:8px}
summary{font-weight:600;cursor:pointer}details p,details li{color:var(--mut);font-size:14px;line-height:1.5}details ul{padding-left:18px;margin:6px 0}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:#1f2937;color:#fff;padding:10px 14px;border-radius:12px;display:flex;gap:12px;align-items:center;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:92vw}
#toast.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}#toast button{background:none;border:0;color:#93c5fd;font:inherit;font-weight:700;cursor:pointer}
#focus{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
#lock{position:fixed;inset:0;z-index:150;background:#0b1120;color:#fff;display:none;align-items:center;justify-content:center;text-align:center;padding:20px}
#lock .lk{width:100%;max-width:280px}#lock input{text-align:center;font-size:22px;letter-spacing:.4em;background:#1e293b;border-color:#334155;color:#fff}
#splash{position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,#0b1120,#1e3a8a 60%,#7c3aed);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:opacity .5s;cursor:pointer}
#splash.out{opacity:0;pointer-events:none}
#splash .ln{stroke-dasharray:240;stroke-dashoffset:240;animation:dr 1.2s .2s ease forwards}@keyframes dr{to{stroke-dashoffset:0}}
#splash h1{margin:10px 0 0;letter-spacing:.4em;font-size:32px;opacity:0;animation:up .6s .9s forwards}
#splash p{margin:0;opacity:0;animation:up .6s 1.2s forwards}#splash small{position:absolute;bottom:40px;opacity:.6}
@media(min-width:768px){
nav{top:0;bottom:auto;width:200px;flex-direction:column;overflow:visible;padding:24px 10px}
nav button{flex:none;text-align:left;display:flex;gap:10px;align-items:center;font-size:14px;padding:10px 12px}nav button b{font-size:18px;display:inline}
main{margin-left:200px;padding:32px 40px;max-width:none}.mob{display:none}#toast{bottom:24px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#splash .ln{stroke-dashoffset:0}#splash h1,#splash p{opacity:1}}
</style></head><body>
<nav id="nav"></nav><main id="m"></main>
<div id="toast"></div><div id="focus"></div>
<div id="lock"><div class="lk"><div style="font-size:42px">🔒</div><h2>Pulse is locked</h2><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN"><div id="lerr" class="mut" style="min-height:18px;margin-bottom:8px"></div><button class="btn w" data-a="unlock">Unlock</button></div></div>
<script>
const K='pulse-v1',$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={tab:'dashboard',sub:'help',burn:false,theme:'auto',budget:6,pin:'',moods:{},lastBackup:0,since:0,notified:{},acts:[],orgs:[],jours:[],timer:null,jt:'',edit:null,q:'',fo:'',locked:false,focus:false};
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
if(!S.since)S.since=Date.now();
S.locked=!!S.pin;S.edit=null;S.focus=false;S.q='';S.fo='';
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hm=m=>{m=Math.round(m||0);const h=Math.floor(m/60),r=m%60;return h?(r?`${h}h ${r}m`:`${h}h`):`${r}m`};
const TABS=[['dashboard','🏠','Home'],['inbox','📥','Inbox'],['planner','📅','Planner'],['delegation','👥','Delegate'],['organizations','💼','Orgs'],['analytics','📊','Stats'],['journal','📓','Journal'],['more','❓','Help']];
let msgI=0;
const msg=()=>{const n=S.acts.filter(a=>a.status==='Completed'&&!a.triage).length,w=n+' task'+(n===1?'':'s');
return [`You've completed ${w}. That is real effort, so give yourself permission to rest.`,`Only your High-priority tasks are showing. ${w} done already, and everything else can wait.`,`It's okay to slow down today. You've done ${w}. Take a breath and come back when you're ready.`][msgI%3]};
const mins=a=>a.actual||a.dur||30;
const orgName=i=>(S.orgs.find(o=>o.id===i)||{}).name||'Unassigned';
const done=a=>a.status==='Completed'&&!a.triage;
const visible=()=>S.acts.filter(a=>!a.triage&&!a.deleg).filter(a=>!(S.burn&&a.status!=='Completed')||a.pri==='High');
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const orgOpts=(sel,ph)=>`<option value="">${ph}</option>`+S.orgs.map(o=>`<option value="${o.id}" ${o.id===sel?'selected':''}>${esc(o.name)}</option>`).join('');
const empty=t=>`<div class="card empty"><div style="font-size:34px;margin-bottom:6px">✨</div>${t}</div>`;
const dl=(n,t,d)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type:t}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)};
const hash=async p=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('pulse'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'x'+p.split('').reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7)}};

/* ---- due dates & reminders ---- */
const dueOf=a=>a.deleg?a.fu:a.due;
function dstate(a){if(a.status==='Completed'||a.triage)return '';const d=dueOf(a);if(!d)return '';const t=ymd(new Date()),day=d.slice(0,10);
 if(day<t)return 'over';if(day>t)return 'soon';if(d.length>10&&new Date(d).getTime()<Date.now())return 'over';return 'today'}
const fmtDue=d=>{const dt=new Date(d.length>10?d:d+'T00:00');return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'})+(d.length>10?' '+dt.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):'')};
const dueTag=a=>{const s=dstate(a);return s?`<span class="tag d${s}">${s==='over'?'⚠ Overdue · ':s==='today'?'Today · ':''}${fmtDue(dueOf(a))}</span>`:''};
function rem(){const l=S.acts.filter(a=>!a.triage&&a.status!=='Completed'&&dueOf(a)&&(!S.burn||a.pri==='High'));return{over:l.filter(a=>dstate(a)==='over'),today:l.filter(a=>dstate(a)==='today')}}
function badge(){try{const r=rem(),n=S.burn?0:r.over.length+r.today.length;if(navigator.setAppBadge){n?navigator.setAppBadge(n):navigator.clearAppBadge()}}catch(e){}}
function notify(t,b){if(S.burn)return;try{if('Notification' in window&&Notification.permission==='granted'){if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification(t,{body:b,icon:'icon-192.png'})).catch(()=>new Notification(t,{body:b}));else new Notification(t,{body:b})}}catch(e){}}
function nextDue(t){const has=!!(t.due&&t.due.length>10),b=t.due?new Date(has?t.due:t.due+'T00:00'):new Date();b.setHours(has?b.getHours():0,has?b.getMinutes():0,0,0);
 const td=ymd(new Date());let g=0;do{if(t.rep==='daily')b.setDate(b.getDate()+1);else if(t.rep==='weekly')b.setDate(b.getDate()+7);else b.setMonth(b.getMonth()+1)}while(ymd(b)<td&&++g<400);
 return ymd(b)+(has?'T'+pad(b.getHours())+':'+pad(b.getMinutes()):'')}

/* ---- toast + undo ---- */
let UNDO=null,tt;
function toast(m,u){clearTimeout(tt);UNDO=u||null;const t=$('#toast');t.innerHTML=`<span>${esc(m)}</span>${u?'<button data-a="undo">Undo</button>':''}`;t.classList.add('show');tt=setTimeout(()=>t.classList.remove('show'),6000)}
function rm(k,i,label){const x=S[k].findIndex(y=>y.id===i);if(x<0)return;const [it]=S[k].splice(x,1);toast(label+' deleted',()=>{S[k].splice(x,0,it)})}

/* ---- views ---- */
function taskRow(t,full){
 const run=S.timer&&S.timer.id===t.id,c=t.status==='Completed';
 return `<div class="card row t-${t.pri} ${run?'run':''}"><div>
 <div class="${c?'done':''}"><b>${esc(t.title)}</b> <span class="tag ${t.pri}">${t.pri}</span>${t.rep?` <span class="tag">🔁 ${t.rep}</span>`:''}</div>
 <div class="mut">${full?`Est ${hm(t.dur||30)}${t.actual?` · Logged ${hm(t.actual)}`:''} · ${esc(t.type||'')} · ${esc(orgName(t.org))} `:''}${dueTag(t)}</div>
 ${full&&t.notes?`<div class="mut" style="margin-top:4px">📝 ${esc(t.notes)}</div>`:''}</div>
 <div class="acts"><button class="ic" data-a="toggle" data-id="${t.id}">${c?'✅':'⚪'}</button>
 ${full&&!c?`<button class="ic" data-a="timer" data-id="${t.id}">${run?`⏹ <span class="tm">${fmt(Math.floor((Date.now()-S.timer.start)/1000))}</span>`:'▶'}</button>`:''}
 ${full?`<button class="ic" data-a="edit" data-id="${t.id}">✏️</button>`:''}
 ${full&&dueOf(t)?`<button class="ic" data-a="ics" data-id="${t.id}">📅</button>`:''}
 ${full?`<button class="ic" data-a="del" data-id="${t.id}">🗑</button>`:''}</div></div>`;
}
const timerBar=()=>{if(!S.timer)return '';const t=S.acts.find(a=>a.id===S.timer.id);
 return t?`<div class="tbar"><span>⏱ ${esc(t.title)} · <b class="tm">${fmt(Math.floor((Date.now()-S.timer.start)/1000))}</b></span><span><button class="btn g" style="padding:6px 12px" data-a="focus">Focus</button> <button class="btn" style="background:#fff;color:var(--ac);padding:6px 14px" data-a="timer" data-id="${t.id}">Stop</button></span></div>`:''};
function plist(){
 let l=visible().filter(a=>(!S.fo||a.org===S.fo)&&(!S.q||(a.title+' '+(a.notes||'')).toLowerCase().includes(S.q.toLowerCase())));
 l=l.slice().sort((a,b)=>(a.status==='Completed')-(b.status==='Completed')||(dueOf(a)||'9999').localeCompare(dueOf(b)||'9999'));
 return l.length?l.map(t=>taskRow(t,true)).join(''):empty(S.q||S.fo?'No matching tasks.':'No tasks yet.')}
const sum=t=>{const p=t.split(/[.!?\n]+/).map(x=>x.trim()).filter(Boolean);
 return{w:p.filter(x=>/\b(finish|complet|done|shipped|launch|solved|won|closed|sent|achiev)/i.test(x)),a:p.filter(x=>/\b(need to|have to|must|tomorrow|to-?do|follow up|remind|next)\b/i.test(x))}};
const list=(h,c,a)=>a.length?`<div style="margin-top:8px"><b style="color:${c};font-size:13px">${h}</b><ul style="margin:4px 0;padding-left:20px">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:'';
const EM=['😫','😕','😐','🙂','😄'];

const V={
dashboard(){
 const d=S.acts.filter(done),h=(d.reduce((a,t)=>a+mins(t),0)/60).toFixed(1),w=S.acts.filter(a=>a.deleg&&a.status!=='Completed').length;
 const f=visible().filter(a=>a.status!=='Completed').sort((a,b)=>(dueOf(a)||'9999').localeCompare(dueOf(b)||'9999')).slice(0,5);
 const t0=new Date().setHours(0,0,0,0),dt=S.acts.filter(a=>done(a)&&(a.doneAt||0)>=t0).length,pend=visible().filter(a=>a.status!=='Completed').length,tot=dt+pend,pc=tot?dt/tot:0,hr=new Date().getHours(),gr=hr<12?'Good morning':hr<18?'Good afternoon':'Good evening',R=26,C=2*Math.PI*R;
 const hero=`<div class="card hero"><svg width="68" height="68" viewBox="0 0 68 68"><circle cx="34" cy="34" r="${R}" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="7"/><circle cx="34" cy="34" r="${R}" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C*pc} ${C}" transform="rotate(-90 34 34)"/><text x="34" y="39" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">${Math.round(pc*100)}%</text></svg><div><h3>${gr}</h3><p>${dt} done today · ${pend} to go</p></div></div>`;
 const r=rem(),n=r.over.length+r.today.length;
 const rb=n?`<div class="ban"><b>🔔 ${r.over.length?r.over.length+' overdue':''}${r.over.length&&r.today.length?' · ':''}${r.today.length?r.today.length+' due today':''}</b>${[...r.over,...r.today].slice(0,4).map(a=>`<div class="mut" style="margin-top:4px">${a.deleg?'👥 Follow up with '+esc(a.deleg)+': ':'• '}${esc(a.title)} ${dueTag(a)}</div>`).join('')}</div>`:'';
 const days=Math.floor((Date.now()-(S.lastBackup||S.since))/864e5);
 const bk=(S.acts.length+S.jours.length>0&&days>=7)?`<div class="ban">💾 It's been ${days} days since your last backup. <button class="btn" style="padding:6px 12px;margin-left:6px" data-a="export">Export now</button></div>`:'';
 const td=ymd(new Date()),mv=S.moods[td];
 const low=(()=>{const v=Object.keys(S.moods).sort().slice(-3).map(k=>S.moods[k]);return v.length===3&&v.every(x=>x<=2)})();
 const sug=low&&!S.burn?`<div class="ban">Your last 3 check-ins were low. <button class="btn" style="padding:6px 12px;margin-left:6px" data-a="burn">Try Burnout Buffer</button></div>`:'';
 const ci=`<div class="card"><b>How's your energy today?</b><div class="moods">${EM.map((e,i)=>`<button class="${mv===i+1?'on':''}" data-a="mood" data-id="${i+1}">${e}</button>`).join('')}</div></div>`;
 const mid=S.burn?`<div class="card" style="text-align:center"><div class="breathe"></div><div class="mut">Breathe in… and out. Nothing else needs you right now.</div></div>`:
 `<div class="grid"><div class="card"><div class="big">${d.length}</div><b>Completed</b><div class="mut">All tasks</div></div><div class="card"><div class="big">${h}h</div><b>Time logged</b><div class="mut">Productive hours</div></div><div class="card"><div class="big">${w}</div><b>Waiting on</b><div class="mut">Pending delegations</div></div></div>`;
 return hero+rb+bk+sug+ci+mid+`<h3>${S.burn?'Only what matters':"Today's focus"}</h3>${f.length?f.map(t=>taskRow(t,false)).join(''):empty('Nothing pending. Add a task in the Planner.')}`;
},
inbox(){
 const l=S.acts.filter(a=>a.triage);
 return `<form data-f="triage" class="card"><input name="t" placeholder="Quick capture: what's on your mind?" required><button class="btn w">Drop in inbox</button></form>
 ${l.length?l.map(t=>`<div class="card"><b>${esc(t.title)}</b><div class="row" style="margin-top:8px"><select data-c="assign" data-id="${t.id}" style="margin:0">${orgOpts('','Assign org…')}</select>

 setpin:()=>{const v=($('#npin')||{}).value||'';if(!/^\d{4,8}$/.test(v)){toast('PIN must be 4 to 8 digits');return 'skip'}hash(v).then(h=>{S.pin=h;save();render();toast('PIN set')});return 'skip'},
 rmpin:()=>{S.pin='';S.locked=false},
 unlock:()=>{const v=($('#pin')||{}).value||'';hash(v).then(h=>{if(h===S.pin){S.locked=false;$('#pin').value='';$('#lerr').textContent='';lockUI()}else $('#lerr').textContent='Wrong PIN'});return 'skip'},
 undo:()=>{if(UNDO)UNDO();UNDO=null;$('#toast').classList.remove('show')},
 intro:()=>{intro();return 'skip'},
 export:()=>{S.lastBackup=Date.now();save();dl('pulse-backup-'+ymd(new Date())+'.json','application/json',JSON.stringify({acts:S.acts,orgs:S.orgs,jours:S.jours,moods:S.moods}));toast('Backup exported')},
 delorg:i=>rm('orgs',i,'Organization'),
 savej:()=>{const v=($('#jt')||{}).value||S.jt;if(!v.trim())return;S.jours.unshift({id:id(),text:v.trim(),at:Date.now()});S.jt=''},
 delj:i=>rm('jours',i,'Entry'),
 mic:()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){alert('Voice input is not supported in this browser.');return 'skip'}
  if(window.rec){window.rec.stop();window.rec=null;$('#mic').textContent='🎙';return 'skip'}
  const r=window.rec=new R();r.continuous=true;r.interimResults=false;
  r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal){S.jt+=e.results[i][0].transcript+' ';const t=$('#jt');if(t)t.value=S.jt;save()}};
  r.onend=()=>{window.rec=null;const m=$('#mic');if(m)m.textContent='🎙'};r.start();$('#mic').textContent='🔴';return 'skip'}
};
const F={
 triage:d=>S.acts.unshift({id:id(),title:d.get('t').trim(),pri:'Medium',dur:30,type:'Deep Work',status:'Pending',triage:true,created:Date.now()}),
 task:d=>{const dur=Math.max(5,(+d.get('h')||0)*60+(+d.get('mm')||0)),dd=d.get('dd'),dt=d.get('dt');
  const o={title:d.get('title').trim(),dur,pri:d.get('pri'),type:d.get('type'),org:d.get('org'),due:dd?dd+(dt?'T'+dt:''):'',rep:d.get('rep'),notes:d.get('notes').trim()};
  if(S.edit){const t=S.acts.find(a=>a.id===S.edit);if(t)Object.assign(t,o);S.edit=null;toast('Task updated')}else S.acts.unshift({id:id(),...o,status:'Pending',created:Date.now()})},
 deleg:d=>S.acts.unshift({id:id(),title:d.get('title').trim(),deleg:d.get('to').trim(),fu:d.get('fu'),org:d.get('org'),pri:'Medium',type:'Delegated',status:'Waiting',created:Date.now()}),
 org:d=>S.orgs.push({id:id(),name:d.get('name').trim(),role:d.get('role').trim(),goal:+d.get('goal')||0})
};
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;
 if(A[b.dataset.a](b.dataset.id)==='skip')return;save();render();
});
document.addEventListener('change',e=>{
 const c=e.target.dataset.c;if(!c)return;
 if(c==='import'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);['acts','orgs','jours'].forEach(k=>(d[k]||[]).forEach(x=>{if(!S[k].some(y=>y.id===x.id))S[k].push(x)}));Object.keys(d.moods||{}).forEach(k=>{if(!S.moods[k])S.moods[k]=d.moods[k]});S.acts.sort((a,b)=>(b.created||0)-(a.created||0));save();render();toast('Backup imported')}catch(_){alert('That file could not be read.')}};r.readAsText(f);return}
 if(c==='fo'){S.fo=e.target.value;const l=$('#plist');if(l)l.innerHTML=plist();return}
 if(c==='budget'){S.budget=Math.max(1,+e.target.value||6);save();render();return}
 const t=S.acts.find(a=>a.id===e.target.dataset.id);if(!t)return;
 if(c==='assign'){t.org=e.target.value;t.triage=false;t.type='Strategic';t.dur=t.dur||30}
 if(c==='dstatus'){t.status=e.target.value;t.doneAt=t.status==='Completed'?Date.now():null}
 save();render();
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.dataset.f;if(!F[f])return;F[f](new FormData(e.target));save();render()});
document.addEventListener('input',e=>{
 if(e.target.id==='jt'){S.jt=e.target.value;save()}
 if(e.target.dataset.s==='q'){S.q=e.target.value;const l=$('#plist');if(l)l.innerHTML=plist()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pin')A.unlock()});
let hideAt=0;
document.addEventListener('visibilitychange',()=>{if(document.hidden)hideAt=Date.now();else if(S.pin&&hideAt&&Date.now()-hideAt>60000){S.locked=true;lockUI()}});

/* ---- background checks (only run while the app is open) ---- */
setInterval(()=>{
 if(S.timer)document.querySelectorAll('.tm').forEach(t=>t.textContent=fmt(Math.floor((Date.now()-S.timer.start)/1000)));
},1000);
setInterval(()=>{
 let ch=false;
 S.acts.forEach(a=>{const d=dueOf(a);if(!d||d.length<=10||a.status==='Completed'||a.triage)return;const k=a.id+d;
  if(!S.notified[k]&&new Date(d).getTime()<=Date.now()){S.notified[k]=1;ch=true;notify('Pulse reminder',(a.deleg?'Follow up: ':'Due: ')+a.title);if(!S.burn)toast('⏰ '+a.title+' is due')}});
 if(S.timer&&!S.timer.alerted){const t=S.acts.find(a=>a.id===S.timer.id);
  if(t&&t.dur&&Date.now()-S.timer.start>=t.dur*60000){S.timer.alerted=1;ch=true;notify('Estimate reached',t.title+': '+hm(t.dur)+' is up');toast('⏱ Estimate reached: '+t.title)}}
 if(ch){save();if(!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||''))render()}
},30000);

/* ---- opening screen ---- */
function hideSplash(){const s=$('#splash');if(!s||s.dataset.h)return;s.dataset.h='1';s.classList.add('out');setTimeout(()=>s.remove(),550)}
function intro(){const d=document.createElement('div');d.id='splash';
 d.innerHTML='<svg viewBox="0 0 120 60" width="170" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path class="ln" d="M5 32 H35 L45 12 L60 52 L72 22 L80 32 H115"/></svg><h1>PULSE</h1><p>Plan. Focus. Recover.</p><small>Tap to continue</small>';
 d.onclick=hideSplash;document.body.appendChild(d);setTimeout(hideSplash,2300)}
intro();render();
</script></body></html>
