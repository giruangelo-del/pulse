 H('About Pulse','<p>A pulse is the rhythm that shows a body is working well: it rises with effort and settles with rest. Pulse tracks that rhythm in your work. The letters stand for <b>P</b>lan, <b>U</b>nderstand, <b>L</b>og, <b>S</b>ustain and <b>E</b>valuate: plan with the Planner and Calendar, understand your time in Stats, log work with timers and the journal, sustain your energy with Burnout Buffer and mood check-ins, and evaluate with the weekly review.</p>')+H('Home','<p>Your day at a glance: a progress ring for today, reminders for overdue and due-today items, a quick energy check-in, totals, and your top five tasks. Tap the circle to finish a task.</p>')+

hows total time logged by timers as days, hours, minutes and seconds, grouped by organization, activity, type or label. Switch between Short and D H M S formats. Under Help, Settings, <b>Appearance</b> you can change presets, accent color, corners, spacing, font, card style and background.</p>')+H('Profiles','<p>Create profiles from the Profile tab (the circle at the top right). Each has its own tasks and settings, and you can sign out and switch. They live on this device and do not sync.</p>')+H('Calendar and work days','<ul><li>The Calendar shows a month. Dots are organization colors. Tap a day to see its tasks.</li><li>In a task, pick <b>Work days</b> to choose when you will do it. Its estimate is split evenly across those days.</li><li>Days turn amber near your daily budget and red when over it.</li><li><b>Move unfinished to tomorrow</b> reschedules anything you missed.</li></ul>')+H('Quick add and tasks','<p>Type a sentence in the Planner, like <i>Finish the report tomorrow 3pm 30m #finance !high</i>. Pulse fills in the date, time, estimate, organization and priority. Tap ＋ for the full form, the three-dot menu on a task for more actions, and add subtasks one per line. Completed tasks are hidden by default.</p><p><b>Templates:</b> tap the three-dot menu → Template on any task to save it. Saving another task under the same name builds a set, and Add creates the whole set in one tap.</p><p><b>On a computer:</b> N new task, / search, C calendar, H home, ? help.</p>')+H('Journal','<p>An end-of-day brain dump you can type or dictate with the mic button. Pulse sorts sentences into Wins and Next steps using keywords. This is simple matching on your device, not AI.</p>')+

 <label>Daily focus goal</label><div class="chips wrap">${[60,120,180,240].map(m=>`<label class="tc"><input type="radio" name="g" value="${m}" ${m===S.tgoal?'checked':''}><span>${hm(m)}</span></label>`).join('')}</div>
 <label style="display:flex;gap:8px;align-items:center;color:var(--tx);font-size:14px;margin-top:12px"><input type="checkbox" name="p" ${S.pet?'':'checked'} style="width:auto;margin:0">Adopt a buddy to keep me motivated</label>
 <div class="dft"><button type="button" class="btn g" data-x="s">Skip</button><button class="btn">Get started</button></div></form>`;
 document.body.appendChild(el);const f=el.querySelector('form');
 f.onsubmit=e=>{e.preventDefault();const n=f.n.value.trim();if(n){PROF.name=n.slice(0,24);savePR()}const g=f.querySelector('[name=g]:checked'),u=f.querySelector('[name=u]:checked');if(g)S.tgoal=+g.value;if(f.p.checked&&!S.pet)S.pet=defPet();S.setup=true;if(u&&u.value==='school'){S.tab='academics';S.asub='courses'}el.remove();save();render()};
 el.querySelector('[data-x=s]').onclick=()=>{S.setup=true;el.remove();save();render()}};
A.setupagain=()=>{showSetup();return 'skip'};

/* ---- buddy ---- */
const lvl=p=>{let l=1,x=p.xp;while(x>=40*l){x-=40*l;l++}return{l,cur:x,need:40*l}};
const tick=p=>{const h=(Date.now()-p.t)/36e5;if(h>0.02){p.joy=pc(Math.max(15,p.joy-h*2));p.food=pc(Math.max(10,p.food-h*3));p.t=Date.now()}};
const gain=(p,xp,co)=>{const b=lvl(p).l;p.xp+=xp;p.coins+=co;const a=lvl(p).l;if(a>b)toast(p.name+' reached level '+a+'!')};
const reward=(kind,t,sec)=>{const p=S.pet;if(!p)return;tick(p);
 if(kind==='task'){const hi=t&&t.pri==='High';gain(p,hi?15:10,hi?3:2);p.cele=Date.now();p.joy=pc(p.joy+10);p.bond=pc(p.bond+1);p.say=0}
 else{p._m=(p._m||0)+sec/60;const x=Math.floor(p._m/5);if(x>0){p._m-=x*5;gain(p,x,Math.floor(x/6))}}};
const _tg=A.toggle;A.toggle=i=>{const t=S.acts.find(a=>a.id===i),was=t&&t.status==='Completed',r=_tg(i);if(t&&!was&&t.status==='Completed')reward('task',t);return r};
const mood=p=>{const hr=new Date().getHours();if(Date.now()-p.cele<12e4)return 'proud';if((hr>=23||hr<6)&&Date.now()-(p.act||0)>6e5)return 'sleepy';if(p.joy<35||p.food<25)return 'sad';if(p.joy>=60)return 'happy';return 'ok'};
const petSvg=(p,m,sz)=>{const{c1,c2,c3}=p,k=p.kind,sc=.8+Math.min(lvl(p).l,6)*.05,fy=k==='blob'?112:90,ink='#1f2937';let b='';
 if(k==='cat')b=`<path d="M146 150q32-10 22-48" stroke="${c1}" stroke-width="12" fill="none" stroke-linecap="round"/><ellipse cx="100" cy="148" rx="46" ry="38" fill="${c1}"/><ellipse cx="100" cy="156" rx="26" ry="22" fill="${c2}" opacity=".7"/><path d="M64 70L70 34 96 56z" fill="${c1}"/><path d="M136 70L130 34 104 56z" fill="${c1}"/><path d="M72 60L74 46 88 56z" fill="${c2}"/><path d="M128 60L126 46 112 56z" fill="${c2}"/><circle cx="100" cy="90" r="42" fill="${c1}"/><ellipse cx="100" cy="106" rx="16" ry="11" fill="${c2}"/>`;
 else if(k==='dog')b=`<path d="M146 152q24-4 22-30" stroke="${c1}" stroke-width="11" fill="none" stroke-linecap="round"/><ellipse cx="100" cy="148" rx="46" ry="38" fill="${c1}"/><ellipse cx="100" cy="156" rx="26" ry="22" fill="${c2}" opacity=".7"/><ellipse cx="60" cy="88" rx="15" ry="28" fill="${c2}" transform="rotate(14 60 88)"/><ellipse cx="140" cy="88" rx="15" ry="28" fill="${c2}" transform="rotate(-14 140 88)"/><circle cx="100" cy="90" r="42" fill="${c1}"/><ellipse cx="100" cy="106" rx="20" ry="14" fill="${c2}"/>`;
 else if(k==='bunny')b=`<circle cx="150" cy="158" r="12" fill="${c2}"/><ellipse cx="100" cy="148" rx="46" ry="38" fill="${c1}"/><ellipse cx="100" cy="156" rx="26" ry="22" fill="${c2}" opacity=".7"/><ellipse cx="78" cy="38" rx="13" ry="34" fill="${c1}"/><ellipse cx="78" cy="42" rx="6" ry="22" fill="${c2}"/><ellipse cx="122" cy="38" rx="13" ry="34" fill="${c1}"/><ellipse cx="122" cy="42" rx="6" ry="22" fill="${c2}"/><circle cx="100" cy="92" r="40" fill="${c1}"/><ellipse cx="100" cy="106" rx="15" ry="10" fill="${c2}"/>`;
 else b=`<path d="M46 150C46 84 68 52 100 52s54 32 54 98c0 26-18 36-54 36S46 176 46 150z" fill="${c1}"/><ellipse cx="76" cy="84" rx="14" ry="9" fill="#fff" opacity=".35" transform="rotate(-25 76 84)"/><path d="M100 52q-4-22 14-28 4 18-14 28z" fill="${c2}"/>`;
 const E=m==='happy'||m==='proud'?`<path d="M80 ${fy}q6-8 12 0M108 ${fy}q6-8 12 0" stroke="${ink}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`:m==='sleepy'?`<path d="M80 ${fy}h12M108 ${fy}h12" stroke="${ink}" stroke-width="3.5" stroke-linecap="round"/>`:`<circle cx="86" cy="${fy-1}" r="5" fill="${ink}"/><circle cx="114" cy="${fy-1}" r="5" fill="${ink}"/><circle cx="87.6" cy="${fy-3}" r="1.7" fill="#fff"/><circle cx="115.6" cy="${fy-3}" r="1.7" fill="#fff"/>${m==='sad'?`<path d="M78 ${fy-12}l14 5M122 ${fy-12}l-14 5" stroke="${ink}" stroke-width="3" stroke-linecap="round"/>`:''}`;
 const M=m==='proud'?`<path d="M90 ${fy+13}q10 14 20 0z" fill="#7f1d1d" stroke="${ink}" stroke-width="2.5" stroke-linejoin="round"/>`:m==='happy'?`<path d="M91 ${fy+14}q9 9 18 0" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/>`:m==='sad'?`<path d="M92 ${fy+21}q8-7 16 0" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/>`:m==='sleepy'?`<circle cx="100" cy="${fy+18}" r="3" fill="${ink}"/>`:`<path d="M94 ${fy+17}q6 4 12 0" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
 const N=k==='dog'?`<ellipse cx="100" cy="${fy+7}" rx="6" ry="4.5" fill="${ink}"/>`:k==='blob'?'':`<path d="M96 ${fy+6}h8l-4 5z" fill="#f472b6"/>`;
 const W=k==='cat'?`<path d="M74 ${fy+14}l-18-3M74 ${fy+19}l-18 3M126 ${fy+14}l18-3M126 ${fy+19}l18 3" stroke="${ink}" stroke-width="1.6" stroke-linecap="round" opacity=".5"/>`:'';
 const ch=`<circle cx="72" cy="${fy+10}" r="6" fill="#f472b6" opacity=".35"/><circle cx="128" cy="${fy+10}" r="6" fill="#f472b6" opacity=".35"/>`;
 const top=k==='blob'?50:52,AC2=p.acc==='scarf'?`<path d="M62 ${fy+36}q38 16 76 0l-3 14q-35 14-70 0z" fill="${c3}"/><path d="M118 ${fy+46}l10 24-13 2z" fill="${c3}"/>`:p.acc==='glasses'?`<circle cx="86" cy="${fy-1}" r="11" fill="none" stroke="${c3}" stroke-width="3"/><circle cx="114" cy="${fy-1}" r="11" fill="none" stroke="${c3}" stroke-width="3"/><path d="M97 ${fy-1}h6" stroke="${c3}" stroke-width="3"/>`:p.acc==='crown'?`<path d="M76 ${top+6}l4-20 12 12 8-18 8 18 12-12 4 20z" fill="${c3}" stroke="#00000022" stroke-width="1.5" stroke-linejoin="round"/>`:'';
 const fx=m==='proud'?`<path d="M152 46l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#fbbf24"/><path d="M42 62l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#fbbf24"/>`:m==='sleepy'?`<text x="140" y="50" font-size="20" font-weight="700" fill="#94a3b8">z</text><text x="154" y="38" font-size="14" font-weight="700" fill="#94a3b8">z</text>`:'';
 return `<svg class="pet" viewBox="0 0 200 200" width="${sz}" height="${sz}" role="img" aria-label="${esc(p.name)}, your buddy"><ellipse cx="100" cy="188" rx="${54*sc}" ry="7" fill="rgba(0,0,0,.12)"/><g transform="translate(100 190) scale(${sc}) translate(-100 -190)">${b}${ch}<g class="eyes">${E}</g>${N}${M}${W}${AC2}</g>${fx}</svg>`};
const say=p=>{const n=PROF.name&&PROF.name!=='Me'?PROF.name:'friend',f=firstTask(),hr=new Date().getHours(),now=Date.now(),
 done=S.acts.filter(a=>a.doneAt&&ymd(new Date(a.doneAt))===DAY()).length,od=f&&f.due&&new Date(f.due.length>10?f.due:f.due+'T23:59')<now,
 w=(a,b,c)=>({cheer:a,calm:b,coach:c}[p.pers]||a),g=hr<12?'Good morning':hr<18?'Good afternoon':'Good evening',q=Math.floor(now/12e5)+(p.say||0);
 if(now-p.cele<12e4)return w(`Yes! Nice work, ${n}! That's ${done} done today.`,`Well done, ${n}. You took a step, and that counts.`,`Good. ${done} down today. Keep the momentum.`);
 if(S.burn)return w(`Rest up, ${n}. I'll be right here, cheering quietly.`,`Rest is part of the plan, ${n}. Breathe. I'm here.`,`Recovery counts as training. Rest, then we go again.`);
 if(S.timer)return w(`Focus mode! I'm right here with you.`,`Steady and calm. You're doing fine.`,`Eyes on the task. No distractions.`);
 if(hr>=23||hr<6)return w(`It's late, ${n}. Sleep well, we'll do great tomorrow.`,`Time to wind down, ${n}. Sleep is productive too.`,`Late night. Sleep. Tomorrow we work.`);
 if(p.food<25)return w(`I'm a little hungry. A treat would be amazing.`,`A small treat would be nice, if you can.`,`Fuel matters. Give me a treat.`);
 if(f&&od)return w(`${n}, "${f.title}" is waiting. Want to start it together?`,`When you're ready, "${f.title}" is the one to begin with.`,`"${f.title}" is overdue. Start it now.`);
 if(f)return w(`Let's begin with "${f.title}". You've got this, ${n}!`,`A good first step today: "${f.title}".`,`First up: "${f.title}". Go.`);
 const X={cheer:[`${g}, ${n}! Ready when you are.`,`You're doing better than you think.`,`Small steps add up. I believe in you!`,`Want to plan something small and doable?`],calm:[`${g}, ${n}. No rush today.`,`One gentle step is enough.`,`You're allowed to go at your own pace.`,`Whatever you choose, I'm with you.`],coach:[`${g}, ${n}. Pick one task and own it.`,`Discipline beats mood. Let's go.`,`Plan it, do it, check it off.`,`Small wins, every day.`]};return X[p.pers||'cheer'][q%4]};
const stat=(l,v)=>`<div class="row" style="margin-top:8px"><span>${l}</span><span class="mut" style="flex:none">${v}%</span></div><div class="bar" style="margin:3px 0 0"><i style="width:${v}%"></i></div>`;
const COLS=['#f59e0b','#fb923c','#f87171','#f472b6','#a78bfa','#60a5fa','#34d399','#a3a3a3','#e7e5e4','#78716c','#fde68a','#1f2937'];
const sw=(k,cur)=>`<div class="swg" style="grid-template-columns:repeat(6,1fr)">${COLS.map(c=>`<button type="button" class="dsw ${cur===c?'on':''}" aria-pressed="${cur===c}" style="background:${c}" data-a="pset" data-id="${k}:${c}" aria-label="${c}"></button>`).join('')}</div>`;
const segp=(k,cur,o)=>`<div class="segb">${o.map(([v,l])=>`<button type="button" class="${cur===v?'on':''}" aria-pressed="${cur===v}" data-a="pset" data-id="${k}:${v}">${l}</button>`).join('')}</div>`;
V.buddy=()=>{if(!S.pet)return `<div class="card pcard">${petSvg(defPet(),'happy',200)}<h3 style="margin:6px 0 4px">Meet your buddy</h3><div class="mut" style="margin-bottom:12px">A little companion who cheers you on, grows as you get things done, and keeps you company. You choose how it looks and sounds.</div><button class="btn w" data-a="adopt">Adopt a buddy</button></div>`;
 const p=S.pet;tick(p);const L=lvl(p),m=mood(p);
 return `<div class="card pcard"><div class="bub">${esc(say(p))}</div>${petSvg(p,m,220)}<div class="pname"><b>${esc(p.name)}</b> <span class="pl">Level ${L.l}</span> <span class="pl">${p.coins} coins</span></div>
 <div class="pstat"><div class="row"><span>Experience</span><span class="mut" style="flex:none">${L.cur} / ${L.need}</span></div><div class="bar" style="margin:3px 0 0"><i style="width:${L.cur/L.need*100}%"></i></div>${stat('Joy',p.joy)}${stat('Fullness',p.food)}${stat('Bond',p.bond)}</div>
 <div class="sg3"><button class="btn" data-a="ppet">Pet</button><button class="btn g" data-a="ptreat">Treat · 3</button><button class="btn g" data-a="pplay">Play</button></div><div class="mut" style="margin-top:10px">Earn XP and coins by finishing tasks and tracking focused time.</div></div>
 <div class="card"><b>Customize</b><div class="opt"><div class="ot">Name</div><button class="btn g w" data-a="pname">${esc(p.name)} · tap to rename</button></div>
 <div class="opt"><div class="ot">Species</div>${segp('kind',p.kind,[['cat','Cat'],['dog','Dog'],['bunny','Bunny'],['blob','Blob']])}</div>
 <div class="opt"><div class="ot">Body color</div>${sw('c1',p.c1)}</div><div class="opt"><div class="ot">Accent color</div>${sw('c2',p.c2)}</div>
 <div class="opt"><div class="ot">Accessory</div>${segp('acc',p.acc,[['none','None'],['scarf','Scarf'],['glasses','Glasses'],['crown','Crown']])}</div>${p.acc!=='none'?`<div class="opt"><div class="ot">Accessory color</div>${sw('c3',p.c3)}</div>`:''}
 <div class="opt"><div class="ot">Voice</div>${segp('pers',p.pers,[['cheer','Cheerful'],['calm','Calm'],['coach','Coach']])}</div>
 <div class="opt"><div class="ot">On Home</div>${segp('home',String(p.home!==false),[['true','Show'],['false','Hide']])}</div></div>`};
const petHome=()=>{const p=S.pet;if(!p)return S.petoff?'':`<div class="card"><div class="row"><div><b>Adopt a buddy</b><div class="mut">A little companion to keep you motivated.</div></div><div style="flex:none;display:flex;gap:6px"><button class="btn g" style="padding:6px 10px" data-a="petno">Not now</button><button class="btn" style="padding:6px 12px" data-a="adopt">Adopt</button></div></div></div>`;
 if(p.home===false)return '';tick(p);return `<button class="card ph" data-a="tab" data-id="buddy" style="width:100%;text-align:left;font:inherit;color:var(--tx)">${petSvg(p,mood(p),84)}<div class="pt"><b>${esc(p.name)}</b> <span class="pl">Level ${lvl(p).l}</span><div style="margin-top:3px">${esc(say(p))}</div></div></button>`};
A.adopt=()=>{if(!S.pet)S.pet=defPet();S.tab='buddy'};A.petno=()=>{S.petoff=true};
A.pname=()=>{askDlg('Name your buddy','Up to 16 characters',S.pet.name,v=>{S.pet.name=v.slice(0,16)});return 'skip'};
A.pset=v=>{const i=v.indexOf(':'),k=v.slice(0,i),x=v.slice(i+1),p=S.pet;if(!p)return;if(k==='home')p.home=x==='true';else p[k]=x};
A.ppet=()=>{const p=S.pet,n=Date.now();tick(p);p.act=n;p.joy=pc(p.joy+8);p.bond=pc(p.bond+1);p.say=(p.say||0)+1;if(n-(p.lp||0)>3e5){p.lp=n;gain(p,2,0)}};
A.ptreat=()=>{const p=S.pet;tick(p);if(p.coins<3){toast('Treats cost 3 coins. Finish tasks to earn more.');return 'skip'}p.coins-=3;p.act=Date.now();p.food=pc(p.food+35);p.joy=pc(p.joy+8);p.bond=pc(p.bond+2);gain(p,4,0);toast(p.name+' loved that')};
A.pplay=()=>{const p=S.pet,n=Date.now();tick(p);if(n-(p.lg||0)<18e4){toast(p.name+' needs a short break. Try again in a few minutes.');return 'skip'}p.lg=n;p.act=n;p.joy=pc(p.joy+18);p.food=pc(p.food-6);p.bond=pc(p.bond+2);gain(p,5,1)};
const _dash=V.dashboard;V.dashboard=()=>{const h=_dash(),ex=petHome()+todayStrip(),i=h.indexOf('</p></div></div>');return i>=0?h.slice(0,i+16)+ex+h.slice(i+16):ex+h};

/* ---- change handlers, import extras, boot ---- */
document.addEventListener('change',e=>{const t=e.target,c=t.dataset&&t.dataset.c;if(!c)return;
 if(c==='semS'||c==='semE'){const v=t.value.trim(),d=v?parseDate(v):'';if(v&&(!d||isNaN(new Date(d+'T00:00')))){toast("Couldn't read that date. Try 12 nov or 12/11");return}S.sem[c==='semS'?'start':'end']=d;save();render();return}
 if(c==='cr'||c==='tg'){const o=S.orgs.find(x=>x.id===t.dataset.id);if(o){o[c]=Math.max(0,+t.value||0);save();render()}return}
 if(c==='tgoalh'){S.tgoal=Math.max(0,Math.min(1440,Math.round((+t.value||0)*60)));save();render();return}
 if(c==='import'){const f=t.files&&t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);
  (d.tl||[]).forEach(x=>{if(!S.tl.some(y=>y.d===x.d&&y.t===x.t&&y.s===x.s))S.tl.push(x)});(d.exams||[]).forEach(x=>{if(!S.exams.some(y=>y.id===x.id))S.exams.push(x)});
  Object.keys(d.gr||{}).forEach(k=>{const a=S.gr[k]=S.gr[k]||[];(d.gr[k]||[]).forEach(x=>{if(!a.some(y=>y.id===x.id))a.push(x)})});
  if(d.sem&&!S.sem.start&&!S.sem.end)S.sem=d.sem;if(d.pet&&!S.pet)S.pet=d.pet;save();render()}catch(e){}};r.readAsText(f)}});
(()=>{const sg=snapsGet();if((S.acts.length||S.orgs.length)&&(!sg[0]||Date.now()-sg[0].at>216e5))snap('Automatic');
 try{const q=new URLSearchParams(location.search).get('a');if(q==='new'){S.sheet=true;S.tab='planner';S.acf=false}else if(q==='today')S.tab='today';if(q)history.replaceState(null,'',location.pathname)}catch(e){}
 if(!S.setup){if(S.acts.length||S.orgs.length){S.setup=true;save()}else showSetup()}
 render()})();
})();
</script></body></html>
