const need=l=>40+50*l,cum=l=>{let t=0;for(let i=1;i<l;i++)t+=need(i);return t};
const LVB=[1,4,8,13,20],growPct=p=>{const l=lvl(p).l;if(l>=20)return 100;const s=stageOf(l),a=cum(LVB[s]),b=cum(LVB[s+1]);return Math.min(100,(s+(p.xp-a)/(b-a))*25)};
const STAGES=['Baby','Kid','Teen','Adult','Legend'],stageOf=l=>l<4?0:l<8?1:l<13?2:l<20?3:4;
const lvl=p=>{let l=1,x=p.xp;while(x>=need(l)){x-=need(l);l++}return{l,cur:x,need:need(l)}};
const mig=p=>{if(p.v===2)return;p.v=2;p.xp=Math.round((p.xp||0)*1.5);p.eye=p.eye||'#1f2937';p.pat=p.pat||'none';p.bg=p.bg||'none';p.callme=p.callme||'';if(p.cheeks==null)p.cheeks=true;
 p.own=p.own||['acc:none','acc:scarf','acc:glasses','acc:crown','bg:none'];if(p.acc&&p.acc!=='none'&&!p.own.includes('acc:'+p.acc))p.own.push('acc:'+p.acc);p.earned=p.earned||p.coins||0;p.born=p.born||Date.now();p.st=p.st||{treats:0,plays:0,pets:0}};
const tick=p=>{mig(p);const h=(Date.now()-p.t)/36e5;if(h>0.02){p.joy=pc(Math.max(15,p.joy-h*2));p.food=pc(Math.max(10,p.food-h*3));p.t=Date.now()}};
const gain=(p,xp,co)=>{const b=lvl(p).l,s0=stageOf(b);p.xp+=xp;p.coins+=co;p.earned=(p.earned||0)+co;const a=lvl(p).l;if(a>b)toast(p.name+' reached level '+a+(stageOf(a)>s0?' and grew into a '+STAGES[stageOf(a)]+'!':'!'))};
const reward=(kind,t,sec)=>{const p=S.pet;if(!p)return;tick(p);
 if(kind==='task'){const hi=t&&t.pri==='High';gain(p,hi?15:10,hi?3:2);p.cele=Date.now();p.joy=pc(p.joy+10);p.bond=pc(p.bond+1);p.say=0}
 else{p._m=(p._m||0)+sec/60;const x=Math.floor(p._m/5);if(x>0){p._m-=x*5;gain(p,x,Math.floor(x/6))}}};
const _tg=A.toggle;A.toggle=i=>{const t=S.acts.find(a=>a.id===i),was=t&&t.status==='Completed',r=_tg(i);if(t&&!was&&t.status==='Completed')reward('task',t);return r};
const mood=p=>{const hr=new Date().getHours();if(Date.now()-p.cele<12e4)return 'proud';if((hr>=23||hr<6)&&Date.now()-(p.act||0)>6e5)return 'sleepy';if(p.joy<35||p.food<25)return 'sad';if(p.joy>=60)return 'happy';return 'ok'};

const splitTop=h=>{const out=[],re=/<(\/?)([a-zA-Z][a-zA-Z0-9]*)\b[^>]*?(\/?)>/g;let depth=0,start=0,m;while((m=re.exec(h))){const close=m[1]==='/',tag=m[2].toLowerCase(),self=m[3]==='/'||VOID.has(tag);if(depth===0&&!close)start=m.index;if(!close&&!self)depth++;else if(close)depth--;if(depth<0)return null;if(depth===0&&(close||self))out.push(h.slice(start,re.lastIndex))}return depth===0?out:null};
const sigOf=b=>/class="card hero"/.test(b)?['hero','Greeting']:/class="card first"/.test(b)?['first','Do this first']:/class="card qc"/.test(b)?['quote','Quote']:(/data-id="buddy"/.test(b)||/Adopt a buddy/.test(b))?['buddy','Buddy']:/Safe to spend today|Track your allowance/.test(b)?['money','Money']:/data-id="today"/.test(b)?['today','Today strip']:/How are you feeling/.test(b)?['mood','Mood check-in']:/^<div class="st"/.test(b)?['stats','Stats']:/Move data between devices/.test(b)?['backup','Backup']:/class="nrow"|Needs attention/.test(b)?['notice','Notices']:null;
const homeBlocks=h=>{const P=splitTop(h);if(!P)return null;const B=[];let inFocus=false;P.forEach((b,i)=>{if(/^<h3[^>]*>Today's focus/.test(b)){inFocus=true;B.push({k:'focus',n:"Today's focus",h:b});return}if(inFocus&&(/^<div class="tk/.test(b)||/class="card empty"/.test(b))){B[B.length-1].h+=b;return}inFocus=false;const s=sigOf(b);B.push({k:s?s[0]:'x'+i,n:s?s[1]:'More',h:b})});return B};
const _d0=V.dashboard;
const orderBlocks=B=>{const L=lay(),o=L.home.ord,hid=L.home.hide,ix=k=>{const i=o.indexOf(k);return i<0?1e6:i};return B.map((b,i)=>({b,i})).sort((x,y)=>(ix(x.b.k)-ix(y.b.k))||(x.i-y.i)).map(x=>x.b).filter(b=>!hid.includes(b.k))};
V.dashboard=()=>{const h=_d0(),B=homeBlocks(h);return B?orderBlocks(B).map(b=>b.h).join(''):h};
DROP.home=d=>{const B=homeBlocks(_d0());if(!B)return;const L=lay(),keys=B.map(b=>b.k);let ord=L.home.ord.filter(k=>keys.includes(k));keys.forEach(k=>{if(!ord.includes(k))ord.push(k)});ord=ord.filter(k=>k!==d.id);const bi=d.item?ord.indexOf(d.item):-1;if(bi>=0)ord.splice(bi,0,d.id);else ord.push(d.id);L.home.ord=ord};
A.lhide=k=>{const L=lay(),h=L.home.hide,i=h.indexOf(k);if(i>=0)h.splice(i,1);else h.push(k)};
A.lreset=()=>{if(!S.lrc){S.lrc=1;toast('Tap Reset again to put everything back');setTimeout(()=>{S.lrc=0},4000);return 'skip'}S.lrc=0;S.lay=DEF();apply();toast('Layout reset')};
V.menu=()=>{const L=lay(),by={};BASE.forEach(t=>by[t[0]]=t);const grp=(t,ids)=>{const it=ids.filter(id=>by[id]&&!L.bar.includes(id));return it.length?`<div class="mg"><div class="mgt">${t}</div><div class="grid">${it.map(id=>`<button class="card" style="font:inherit;color:var(--tx);cursor:pointer;margin:0;text-align:center" data-a="tab" data-id="${id}"><div>${ic(by[id][1],26)}</div><b>${lab(id)}</b></button>`).join('')}</div></div>`:''};
 return grp('Main',L.main)+grp('Extras',L.extra)+grp('Tools and technical',L.tech)+`<button type="button" class="btn g w" style="margin-top:14px" data-a="tab" data-id="layout">Edit layout</button>`};
V.layout=()=>{const L=lay(),by={};BASE.forEach(t=>by[t[0]]=t);
 const row=id=>`<div class="lrow" data-dk="lay" data-di="${id}"><button type="button" class="dh" aria-label="Drag ${esc(lab(id))}">${ic('grip',18)}</button>${ic(by[id][1],18)}<span>${esc(lab(id))}</span>${LOCK.includes(id)?'<span class="mut" style="margin-left:auto;font-size:11px">always available</span>':''}</div>`;
 const box=(g,t,cap,note)=>`<div class="card"><div class="row"><b>${t}</b><span class="mut" style="flex:none">${cap?L[g].length+' of '+cap:L[g].length}</span></div>${note?`<div class="mut" style="font-size:12px;margin:2px 0 8px">${note}</div>`:''}<div class="ll" data-dl="${g}">${L[g].map(row).join('')||'<div class="rke">Drop items here</div>'}</div></div>`;
 const hb=homeBlocks(_d0())||[],keys=hb.map(b=>b.k);let ord=L.home.ord.filter(k=>keys.includes(k));keys.forEach(k=>{if(!ord.includes(k))ord.push(k)});const hv=k=>hb.find(b=>b.k===k);
 return `<div class="card"><b>Arrange Pulse your way</b><div class="mut" style="margin-top:4px">Drag the dotted handle to move things. Drop on another item to put it before that one. Changes save automatically.</div></div>`+box('bar','Bottom bar',4,'Always in reach. More is always the fifth button. When it is full, drop on one to swap.')+box('main','Main','','Your core sections, shown at the top of More.')+box('extra','Extras','','Useful, but not daily.')+box('tech','Tools and technical','','Backups, profile, help and settings.')+box('hide','Hidden','','Not shown anywhere. Drag back to bring one home.')
 +`<div class="card"><b>Home cards</b><div class="mut" style="font-size:12px;margin:2px 0 8px">Drag to reorder. Tap the eye to hide or show a card.</div><div class="ll" data-dl="home">${ord.map(k=>{const b=hv(k);return `<div class="lrow" data-dk="home" data-di="${k}"><button type="button" class="dh" aria-label="Drag ${esc(b.n)}">${ic('grip',18)}</button><span style="flex:1">${esc(b.n)}</span><button type="button" class="ic" data-a="lhide" data-id="${k}" aria-label="Show or hide">${ic(L.home.hide.includes(k)?'eyeoff':'eye',18)}</button></div>`}).join('')}</div></div>`
 +`<button type="button" class="btn g w" data-a="lreset">Reset layout</button>`};
window._pulse={ensure,mv,step,find,layMove,lay,apply,DROP,homeBlocks,splitTop,dayPlan:window.dayPlan,gapsOf,events,DEF};
apply();render();
})();
</script></body></html>
